plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()

	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}

	def modrinthRepository = maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}

	exclusiveContent {
		forRepositories(modrinthRepository)

		filter {
			includeGroup "maven.modrinth"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"steward" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// LuckPerms API used by Steward's common/server code.
	compileOnly "net.luckperms:api:5.4"

	// LuckPerms available when running the development environment.
	runtimeOnly "maven.modrinth:Vebnzrzj:UHUghDkV"

	// Mod Menu API is only needed by Steward's client source set.
	clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Install Mod Menu when launching the development client.
	clientRuntimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version

	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name

	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${projectName}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add Maven publishing repositories here when needed.
	}
}